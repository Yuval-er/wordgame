<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>四级单词大冒险</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2358B8FF'/%3E%3Cstop offset='1' stop-color='%231B86D6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Cpath d='M20 44 V22 l12 14 V22 l12 14 V44' stroke='%23fff' stroke-width='5' stroke-linecap='round' stroke-linejoin='round' fill='none' opacity='.95'/%3E%3C/svg%3E">
<style>
/* ============ 基础 ============ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --sky-50:#EAF7FF; --sky-100:#D9EEFF; --sky-200:#B5DDFF; --sky-300:#8CCBFF;
  --sky-400:#58B8FF; --sky-500:#2F9FF0; --sky-600:#1B86D6; --sky-700:#1469AC;
  --ink:#123D5C; --ink-soft:#3E6E92; --ink-faint:#6C93B3;
  --aqua:#38E1C8; --amber:#FFC94D; --coral:#FF8A6B; --ok:#2FC97D; --err:#FF6B6B;
  --glass:rgba(255,255,255,.46);
  --glass-strong:rgba(255,255,255,.68);
  --glass-line:rgba(255,255,255,.75);
  --shadow-lg:0 18px 50px rgba(27,134,214,.20);
  --shadow-sm:0 8px 24px rgba(27,134,214,.14);
  --r-lg:26px; --r-md:18px; --r-sm:12px;
  --font:'HarmonyOS Sans SC','MiSans','PingFang SC','Noto Sans SC','Microsoft YaHei',system-ui,-apple-system,sans-serif;
  --ipa:'Noto Sans','Arial Unicode','Microsoft YaHei',system-ui,sans-serif;
}
html{height:100%}
body{
  font-family:var(--font); color:var(--ink); min-height:100%;
  background:
    radial-gradient(1100px 620px at 85% -10%, rgba(88,184,255,.55), transparent 60%),
    radial-gradient(900px 500px at -10% 30%, rgba(56,225,200,.32), transparent 55%),
    radial-gradient(800px 600px at 60% 115%, rgba(140,203,255,.45), transparent 60%),
    linear-gradient(165deg, #F3FBFF 0%, #DCEEFF 45%, #C8E6FF 100%);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
/* 背景光斑与气泡 */
.bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.bg i{position:absolute;display:block;border-radius:50%;background:rgba(255,255,255,.30);border:1px solid rgba(255,255,255,.5);animation:float 18s ease-in-out infinite}
.bg i:nth-child(1){width:90px;height:90px;left:6%;top:12%;animation-delay:-2s}
.bg i:nth-child(2){width:46px;height:46px;left:78%;top:22%;animation-delay:-8s;animation-duration:22s}
.bg i:nth-child(3){width:130px;height:130px;left:18%;top:68%;animation-delay:-12s;animation-duration:26s}
.bg i:nth-child(4){width:60px;height:60px;left:88%;top:62%;animation-delay:-5s;animation-duration:20s}
.bg i:nth-child(5){width:30px;height:30px;left:46%;top:8%;animation-delay:-15s;animation-duration:16s}
.bg i:nth-child(6){width:76px;height:76px;left:62%;top:84%;animation-delay:-9s;animation-duration:24s}
@keyframes float{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-34px) scale(1.06)}}
@media (prefers-reduced-motion:reduce){.bg i{animation:none}}

/* ============ 布局 ============ */
#app{position:relative;z-index:1;max-width:960px;margin:0 auto;padding:16px 14px 42px}
.view{display:none;animation:fadeUp .35s ease}
.view.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* 玻璃面板 */
.glass{
  background:var(--glass); backdrop-filter:blur(18px) saturate(1.35);
  -webkit-backdrop-filter:blur(18px) saturate(1.35);
  border:1px solid var(--glass-line);
  border-radius:var(--r-lg);
  box-shadow:var(--shadow-sm), inset 0 1px 0 rgba(255,255,255,.75);
}
.glass-strong{background:var(--glass-strong)}

/* 头部 */
.topbar{display:grid;grid-template-columns:minmax(48px,1fr) auto minmax(48px,1fr);align-items:center;gap:10px;padding:10px 4px 14px}
.topbar .back{grid-column:1;justify-self:start;width:48px;height:46px;display:grid;place-items:center;border:none;border-radius:14px;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--glass-line);box-shadow:var(--shadow-sm);cursor:pointer;color:var(--ink);transition:transform .15s}
.topbar .title{grid-column:2;grid-row:1;text-align:center;font-size:16px;font-weight:800;color:var(--ink)}
.topbar .title.t-back{cursor:pointer;padding:10px 0;border-radius:12px}
.topbar .back:active{transform:scale(.92)}
.topbar .title{font-size:17px;font-weight:700;min-width:0;max-width:calc(100vw - 180px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar .pts{grid-column:3;justify-self:end;white-space:nowrap;font-size:13px;font-weight:700;color:var(--sky-700);background:rgba(255,255,255,.55);border:1px solid var(--glass-line);padding:7px 12px;border-radius:999px;box-shadow:var(--shadow-sm)}

/* 按钮 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:16px;font-family:var(--font);font-weight:700;cursor:pointer;transition:transform .15s,box-shadow .15s,opacity .15s;min-height:48px;padding:0 22px;font-size:16px}
.btn:active{transform:scale(.95)}
.btn:focus-visible{outline:3px solid var(--sky-400);outline-offset:2px}
.btn-primary{color:#fff;background:linear-gradient(135deg,var(--sky-400),var(--sky-600));box-shadow:0 10px 26px rgba(47,159,240,.42)}
.btn-primary:hover{box-shadow:0 14px 30px rgba(47,159,240,.5)}
.btn-aqua{color:#fff;background:linear-gradient(135deg,var(--aqua),#1FBFA6);box-shadow:0 10px 26px rgba(56,225,200,.4)}
.btn-ghost{color:var(--sky-700);background:rgba(255,255,255,.62);border:1px solid var(--glass-line);box-shadow:var(--shadow-sm)}
.btn-soft{color:var(--sky-700);background:rgba(88,184,255,.16);border:1px solid rgba(88,184,255,.35)}
.btn-block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}

/* ============ 主菜单 ============ */
.hero{padding:26px 22px 24px;text-align:center;margin-bottom:16px;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;inset:0;background:radial-gradient(300px 130px at 80% 0%, rgba(255,255,255,.65), transparent 70%);pointer-events:none}
.hero .logo{width:74px;height:74px;margin:0 auto 12px;border-radius:24px;display:grid;place-items:center;background:linear-gradient(135deg,var(--sky-400),var(--sky-600));box-shadow:0 14px 30px rgba(47,159,240,.45);position:relative}
.hero h1{font-size:26px;font-weight:800;letter-spacing:.5px;color:var(--ink);position:relative}
.hero .sub{margin-top:6px;font-size:13px;color:var(--ink-soft);position:relative}
.hero .meta{display:flex;justify-content:center;gap:14px;margin-top:16px;position:relative}
.hero .meta div{font-size:13px;color:var(--ink-soft)}
.hero .meta b{display:block;font-size:20px;color:var(--sky-700);font-weight:800}
.daily{margin-bottom:16px;padding:16px 18px;display:flex;align-items:center;gap:16px}
.ring{width:64px;height:64px;flex-shrink:0;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;font-weight:800;color:var(--sky-700)}
.daily .info{flex:1;min-width:0}
.daily .info .t{font-size:14px;font-weight:700}
.daily .info .d{font-size:12px;color:var(--ink-soft);margin-top:3px}
.daily .go{flex-shrink:0}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.menu .mcard{padding:18px 16px;cursor:pointer;transition:transform .15s;display:flex;flex-direction:column;gap:10px;align-items:flex-start;text-align:left}
.menu .mcard:active{transform:scale(.96)}
.menu .mcard .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:rgba(88,184,255,.18);color:var(--sky-600)}
.menu .mcard .tt{font-size:15px;font-weight:700}
.menu .mcard .dd{font-size:12px;color:var(--ink-faint);line-height:1.5}

/* ============ 关卡地图 ============ */
.sec-title{font-size:15px;font-weight:800;margin:18px 4px 10px;display:flex;align-items:center;justify-content:space-between}
.sec-title .hint{font-size:12px;color:var(--ink-faint);font-weight:500}
.ch-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.ch-card{padding:12px 6px;text-align:center;cursor:pointer;border-radius:var(--r-md);position:relative;transition:transform .15s;min-width:0;overflow:hidden}
.ch-card:active{transform:scale(.94)}
.ch-card .letter{font-size:20px;font-weight:800;color:var(--sky-700)}
.ch-card .cnt{font-size:11px;color:var(--ink-faint);margin-top:2px}
.ch-card .star-row{margin-top:6px;display:flex;justify-content:center;gap:2px}
.ch-card .star-num{font-size:10px;color:var(--ink-faint);margin-top:2px;letter-spacing:.2px}
.ch-card .lock{position:absolute;top:8px;right:8px;width:20px;height:20px}
.ch-card.done{border:1px solid rgba(47,201,125,.4);background:linear-gradient(135deg,rgba(255,255,255,.62),rgba(47,201,125,.16))}
.ch-card.cur{border:1px solid rgba(88,184,255,.6);box-shadow:0 8px 22px rgba(47,159,240,.3)}
.stage-list{display:flex;flex-direction:column;gap:10px}
.stage-row{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;transition:transform .15s}
.stage-row:active{transform:scale(.98)}
.stage-row .no{width:44px;height:44px;flex-shrink:0;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:16px;color:#fff;background:linear-gradient(135deg,var(--sky-400),var(--sky-600));box-shadow:0 8px 18px rgba(47,159,240,.35)}
.stage-row.done .no{background:linear-gradient(135deg,var(--ok),#1FA36B)}
.stage-row.locked .no{background:rgba(108,147,179,.35);color:#fff;box-shadow:none}
.stage-row .body{flex:1;min-width:0}
.stage-row .body .t{font-size:15px;font-weight:700}
.stage-row .body .d{font-size:12px;color:var(--ink-faint);margin-top:2px}
.stage-row .stars{flex-shrink:0;display:flex;gap:2px}
.stage-row.locked{opacity:.6;cursor:not-allowed}

/* ============ 闪卡学习 ============ */
.learn-progress{height:8px;border-radius:99px;background:rgba(255,255,255,.6);overflow:hidden;margin:16px 0 0;border:1px solid var(--glass-line)}
.learn-progress span{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--sky-400),var(--aqua));transition:width .3s}
.flashcard{min-height:340px;padding:22px;text-align:center;position:relative;cursor:pointer;user-select:none;perspective:1000px}
.flashcard .fc-inner{position:relative;width:100%;height:100%;min-height:296px;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.4,.2,.2,1)}
.flashcard.flipped .fc-inner{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;border-radius:var(--r-md);backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(255,255,255,.6);border:1px solid var(--glass-line);box-shadow:var(--shadow-sm)}
.fc-face.back{transform:rotateY(180deg)}
.fc-word{font-size:34px;font-weight:800;letter-spacing:.5px}
.fc-ph{font-size:15px;color:var(--sky-600);letter-spacing:.5px;font-family:var(--ipa)}
.fc-mean{font-size:17px;line-height:1.7;color:var(--ink);padding:0 6px}
.fc-tip{position:absolute;bottom:12px;left:0;right:0;font-size:12px;color:var(--ink-faint)}
.learn-actions{display:flex;gap:10px;margin-top:14px}
.learn-actions .btn{flex:1;min-height:52px}

/* ============ 玩法选择 ============ */
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode-card{padding:18px 16px;cursor:pointer;display:flex;flex-direction:column;gap:8px;transition:transform .15s}
.mode-card:active{transform:scale(.96)}
.mode-card .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center}
.mode-card .tt{font-size:15px;font-weight:800}
.mode-card .dd{font-size:12px;color:var(--ink-faint);line-height:1.5}

/* ============ 游戏通用 ============ */
.game-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:8px}
.game-head .g-t{font-size:16px;font-weight:800}
.game-head .pill{font-size:12px;font-weight:700;color:var(--sky-700);background:rgba(255,255,255,.6);border:1px solid var(--glass-line);padding:6px 12px;border-radius:999px;box-shadow:var(--shadow-sm)}
.q-progress{height:6px;border-radius:99px;background:rgba(255,255,255,.6);overflow:hidden;margin-bottom:16px;border:1px solid var(--glass-line)}
.q-progress span{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--sky-400),var(--aqua));transition:width .3s}
.q-word{text-align:center;padding:26px 16px 20px}
.q-word .big{font-size:36px;font-weight:800;letter-spacing:.5px}
.q-word .ph{font-size:15px;color:var(--sky-600);margin-top:8px;font-family:var(--ipa)}
.q-word .cn{font-size:22px;font-weight:700;line-height:1.6}
.opts{display:grid;gap:12px;padding:0 4px}
.opt{width:100%;min-height:56px;padding:14px 16px;border-radius:var(--r-md);border:1px solid var(--glass-line);background:rgba(255,255,255,.66);font-family:var(--font);font-size:16px;color:var(--ink);cursor:pointer;text-align:left;transition:transform .12s,background .2s,border-color .2s;box-shadow:var(--shadow-sm)}
.opt:active{transform:scale(.98)}
.opt.right{background:rgba(47,201,125,.22);border-color:var(--ok);color:#0E7A45}
.opt.wrong{background:rgba(255,107,107,.18);border-color:var(--err);color:#B33}
.opt[disabled]{pointer-events:none}
.spell-input{display:block;width:100%;min-height:60px;font-size:24px;letter-spacing:2px;text-align:center;font-family:var(--font);font-weight:700;border-radius:var(--r-md);border:2px solid rgba(88,184,255,.5);background:rgba(255,255,255,.75);color:var(--ink);outline:none}
.spell-input:focus{border-color:var(--sky-500);box-shadow:0 0 0 4px rgba(88,184,255,.18)}
.spell-hint{text-align:center;font-size:13px;color:var(--ink-soft);margin-top:10px}

/* 翻牌配对 */
.match-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.mcard{aspect-ratio:.82;border-radius:var(--r-md);cursor:pointer;position:relative;perspective:600px}
.mcard .mc-inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .4s}
.mcard.flipped .mc-inner{transform:rotateY(180deg)}
.mcard .mc-f{position:absolute;inset:0;border-radius:var(--r-md);backface-visibility:hidden;display:grid;place-items:center;text-align:center;padding:8px 6px;font-size:12px;font-weight:700;word-break:break-word;line-height:1.35;overflow:hidden}
.mcard .mc-front{background:linear-gradient(135deg,var(--sky-400),var(--sky-600));color:#fff;box-shadow:0 8px 18px rgba(47,159,240,.35)}
.mcard .mc-back{transform:rotateY(180deg);background:rgba(255,255,255,.82);border:1px solid var(--glass-line);box-shadow:var(--shadow-sm)}
.mcard.matched .mc-inner{animation:pop .4s ease}
.mcard.matched .mc-back{background:rgba(47,201,125,.24);border-color:var(--ok);color:#0E7A45}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.12)}100%{transform:scale(1)}}

/* 打地鼠 */
.whack-field{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:10px 4px}
.whole{aspect-ratio:1.35;border-radius:var(--r-md);background:rgba(255,255,255,.5);border:1px solid var(--glass-line);box-shadow:var(--shadow-sm);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;cursor:pointer;color:var(--sky-700);transition:transform .1s}
.whole:active{transform:scale(.94)}
.whole.empty{visibility:hidden}
.whole.target{background:linear-gradient(135deg,#0FC3A6,#089A82);color:#fff;border:2px solid #067A66;box-shadow:0 8px 20px rgba(10,164,138,.45)}
.whole.plain{background:rgba(255,255,255,.55);color:#AEB8C6;border:1px dashed rgba(150,162,178,.6);box-shadow:none}
.whole.bad{background:rgba(255,107,107,.25);color:#B33;border-color:var(--err)}

/* 消消乐 */
.pop-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.pcell{aspect-ratio:1;border-radius:var(--r-sm);display:grid;place-items:center;font-size:20px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--sky-400),var(--sky-600));box-shadow:0 6px 14px rgba(47,159,240,.3)}
.pcell.cleared{background:rgba(255,255,255,.28);box-shadow:none;color:transparent;border:1px dashed rgba(88,184,255,.5)}

/* ============ 结算 ============ */
.result-hero{text-align:center;padding:30px 20px 26px}
.result-hero .r-t{font-size:22px;font-weight:800}
.result-hero .stars{display:flex;justify-content:center;gap:8px;margin-top:16px}
.result-hero .stars svg{width:46px;height:46px}
.result-hero .stars .s-off{opacity:.25}
.result-hero .r-sub{margin-top:12px;font-size:14px;color:var(--ink-soft)}
.result-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.rstat{text-align:center;padding:14px 6px}
.rstat b{display:block;font-size:22px;font-weight:800;color:var(--sky-700)}
.rstat span{font-size:11px;color:var(--ink-faint)}
.result-actions{display:flex;flex-direction:column;gap:10px}
.wrong-list{margin-top:16px;padding:16px}
.wrong-list .wl-t{font-size:14px;font-weight:800;margin-bottom:10px}
.wrong-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed rgba(88,184,255,.3)}
.wrong-item:last-child{border-bottom:none}
.wrong-item .w{font-weight:800;font-size:15px;min-width:90px}
.wrong-item .m{font-size:12px;color:var(--ink-soft);flex:1;min-width:0}

/* ============ 错题本/复习 ============ */
.review-card{min-height:300px;padding:22px;text-align:center;margin-bottom:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.review-card .big{font-size:32px;font-weight:800}
.review-card .ph{font-size:14px;color:var(--sky-600)}
.review-card .cn{font-size:18px;line-height:1.7}
.empty-state{text-align:center;padding:44px 20px;color:var(--ink-faint)}
.empty-state .e-ic{width:64px;height:64px;margin:0 auto 14px;border-radius:20px;display:grid;place-items:center;background:rgba(47,201,125,.16);color:var(--ok)}

/* ============ 统计 ============ */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat-card{padding:16px;text-align:center}
.stat-card .v{font-size:24px;font-weight:800;color:var(--sky-700)}
.stat-card .k{font-size:12px;color:var(--ink-faint);margin-top:4px}
.chart-card{padding:16px 18px;margin-top:12px}
.chart-card .t{font-size:14px;font-weight:800;margin-bottom:14px}
.bars{display:flex;align-items:flex-end;gap:8px;height:120px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.bar-track{width:100%;max-width:34px;height:88px;border-radius:8px;background:rgba(88,184,255,.14);position:relative;overflow:hidden}
.bar-fill{position:absolute;bottom:0;left:0;right:0;border-radius:8px;background:linear-gradient(180deg,var(--aqua),var(--sky-500));transition:height .5s}
.bar-col .d{font-size:11px;color:var(--ink-faint)}
.bar-col .n{font-size:11px;font-weight:700;color:var(--sky-700)}
.chapter-progress{margin-top:12px;padding:16px}
.chapter-progress .t{font-size:14px;font-weight:800;margin-bottom:12px}
.chap-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px dashed rgba(88,184,255,.25)}
.chap-row:last-child{border-bottom:none}
.chap-row .L{min-width:56px;font-weight:800;color:var(--sky-600);flex-shrink:0;white-space:nowrap}
.chap-row .tk{flex:1;height:8px;border-radius:99px;background:rgba(88,184,255,.14);overflow:hidden}
.chap-row .tk span{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--sky-400),var(--aqua))}
.chap-row .p{font-size:11px;color:var(--ink-faint);width:44px;text-align:right;flex-shrink:0}

/* ============ 设置 ============ */
.set-group{display:flex;flex-direction:column;gap:4px;padding:14px 18px;margin-bottom:12px}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px dashed rgba(88,184,255,.25)}
.set-row:last-child{border-bottom:none}
.set-row .k{font-size:14px;font-weight:700}
.set-row .d{font-size:12px;color:var(--ink-faint);margin-top:3px}
.seg{display:flex;gap:6px}
.seg button{flex:1;min-height:38px;padding:0 12px;border-radius:12px;border:1px solid var(--glass-line);background:rgba(255,255,255,.55);font-family:var(--font);font-size:13px;font-weight:700;color:var(--ink-soft);cursor:pointer;transition:all .15s}
.seg button.on{background:linear-gradient(135deg,var(--sky-400),var(--sky-600));color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(47,159,240,.35)}
.switch{width:52px;height:30px;border-radius:99px;border:1px solid var(--glass-line);background:rgba(108,147,179,.3);cursor:pointer;position:relative;transition:background .2s;flex-shrink:0}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(18,61,92,.25);transition:left .2s}
.switch.on{background:linear-gradient(135deg,var(--sky-400),var(--sky-600))}
.switch.on::after{left:25px}
.danger{color:var(--err);border-color:rgba(255,107,107,.4);background:rgba(255,107,107,.1)}

/* ============ Toast ============ */
#toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(20px);z-index:99;padding:12px 20px;border-radius:99px;background:rgba(18,61,92,.86);color:#fff;font-size:14px;font-weight:700;opacity:0;pointer-events:none;transition:all .3s;max-width:86vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.ok{background:rgba(18,146,99,.9)}
#toast.bad{background:rgba(190,62,62,.92)}

/* ============ 桌面适配 ============ */
@media (min-width:768px){
  #app{padding:26px 24px 52px}
  .menu{grid-template-columns:repeat(4,1fr)}
  .ch-grid{grid-template-columns:repeat(8,1fr)}
  .mode-grid{grid-template-columns:repeat(5,1fr)}
  .match-grid{grid-template-columns:repeat(8,1fr)}
  .mcard .mc-f{font-size:11.5px}
  .ch-card .letter{font-size:16px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .stats-grid{grid-template-columns:repeat(4,1fr)}
  .hero .logo{width:86px;height:86px}
  .hero h1{font-size:30px}
  .whack-field{grid-template-columns:repeat(3,1fr);max-width:560px;margin:0 auto}
  .pop-grid{max-width:520px;margin:0 auto 16px}
  .flashcard{max-width:560px;margin:0 auto}
}
@media (max-width:767px){.mode-grid > :last-child:nth-child(odd){grid-column:1/-1}}

/* ---------- 发音 (Web Speech) ---------- */
let voices=[];
function loadVoices(){voices=speechSynthesis.getVoices();}
if('speechSynthesis' in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices;}
function speak(word,force){
  if(!('speechSynthesis' in window))return;
  if(!force&&!S.autoSpeak)return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(word);
    u.lang='en-US';u.rate=0.9;
    const v=voices.find(v=>/en(-|_)US/i.test(v.lang))||voices.find(v=>/^en/i.test(v.lang));
    if(v)u.voice=v;
    speechSynthesis.speak(u);
  }catch(e){}
}

// WORDS: [word, phonetic, meaning, example?]
const UNIT_META=[
  {name:'动词·上',desc:'真题最高频动词，先拿下'},
  {name:'动词·下',desc:'继续猛攻高频动词'},
  {name:'名词·上',desc:'阅读理解的关键信息'},
  {name:'名词·下',desc:'名词进阶，理解文章主题'},
  {name:'形副·专练',desc:'修饰语精讲，细节题克星'},
  {name:'听力①',desc:'听力高频词，听懂对话'},
  {name:'听力②',desc:'商务职场场景高频词'},
  {name:'听力③',desc:'科技与学术场景高频词'},
  {name:'听力④',desc:'健康与心理场景高频词'},
  {name:'阅读·必考',desc:'阅读题反复出现的核心词'}
];
const UNIT_SIZES=[15,15,15,15,20,28,28,28,28,40];
const CHAPTERS=[];
{
  let off=0;
  UNIT_SIZES.forEach((sz,i)=>{
    const list=WORDS.slice(off,off+sz);off+=sz;
    const stages=[];
    for(let j=0;j<list.length;j+=10)stages.push({words:list.slice(j,j+10)});
    CHAPTERS.push({letter:'U'+(i+1),name:UNIT_META[i].name,desc:UNIT_META[i].desc,words:list,stages});
  });
}
const TOTAL_WORDS=WORDS.length;
function stageKey(chIdx,stIdx){return CHAPTERS[chIdx].letter+'-'+stIdx;}
function stageOf(chIdx,stIdx){return CHAPTERS[chIdx].stages[stIdx];}

/* ---------- 状态 ---------- */
const KEY='cet4adv_v1';
const DEFAULTS={
  points:0,bestCombo:0,streak:0,lastDay:'',todayLearned:0,
  dailyGoal:20,autoSpeak:true,showPhonetic:true,
  words:{},        // w -> {lv,last,wrong,n}
  stages:{},       // key -> {stars,done,times}
  days:{}          // 'YYYY-M-D' -> learned
};
let S=null;
function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw){const d=JSON.parse(raw);return Object.assign({},DEFAULTS,d);}
  }catch(e){}
  return Object.assign({},DEFAULTS);
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function newDayIfNeeded(){
  if(S.lastDay!==''&&!isToday(S.lastDay)){
    const y=new Date();y.setDate(y.getDate()-1);
    const ys=y.getFullYear()+'-'+(y.getMonth()+1)+'-'+y.getDate();
    S.streak=(S.lastDay===ys)?S.streak+1:1;
    S.lastDay=todayStr();S.todayLearned=0;
    save();
  }else if(S.lastDay===''){
    S.lastDay=todayStr();S.todayLearned=0;
    if(!(S.streak>0))S.streak=1;
    save();
  }else if(!(S.streak>0)&&S.todayLearned>0){
    S.streak=1;save();
  }
}
function addPoints(n){S.points+=Math.max(0,n);save();}
function wordState(w){
  if(!S.words[w])S.words[w]={lv:0,last:0,wrong:0,n:0};
  return S.words[w];
}
function markWord(w,correct){
  const st=wordState(w);
  st.n++;st.last=Date.now();
  if(correct){st.lv=Math.min(5,st.lv+1);}
  else{st.lv=Math.max(0,st.lv-1);st.wrong++;}
  if(!isToday(S.lastDay))newDayIfNeeded();
  if(st.n===1&&isToday(S.lastDay))S.todayLearned++;
  save();
  return st;
}
function isLearned(w){return !!(S.words[w]&&S.words[w].n>0);}
function learnedCount(){let c=0;for(const w of WORDS)if(isLearned(w[0]))c++;return c;}
function masteredCount(){let c=0;for(const w of WORDS){const st=S.words[w[0]];if(st&&st.n>0&&st.lv>=3)c++;}return c;}
function INTERVAL(){return [1,2,4,7,15,30];}
function dueWords(){
  const out=[];
  for(const w of WORDS){
    const st=S.words[w[0]];
    if(!st)continue;
    const iv=INTERVAL()[Math.min(5,st.lv)];
    if(Date.now()-st.last>=iv*86400*1000)out.push(w);
  }
  return out;
}
function wrongWords(){
  const out=[];
  for(const w of WORDS){const st=S.words[w[0]];if(st&&st.wrong>0)out.push(w);}
  return out;
}
function stageStars(chIdx,stIdx){
  const st=S.stages[stageKey(chIdx,stIdx)];
  return st?st.stars:0;
}
function stageDone(chIdx,stIdx){return stageStars(chIdx,stIdx)>0;}
function stageUnlocked(chIdx,stIdx){
  if(stIdx===0)return true;
  return stageDone(chIdx,stIdx-1);
}
function chapterStars(chIdx){
  let s=0;CHAPTERS[chIdx].stages.forEach((_,i)=>s+=stageStars(chIdx,i));
  return s;
}
function chapterMaxStars(chIdx){return CHAPTERS[chIdx].stages.length*3;}

}

function topbar(title,backTo,backParams){
  let bp='null';
  if(backParams){
    bp='{'+Object.keys(backParams).map(k=>{
      const v=backParams[k];
      const sv=typeof v==='string'?'\''+v.replace(/'/g,"\\'")+'\'':String(v);
      return k+':'+sv;
    }).join(',')+'}';
  }
  return '<div class="topbar">'
    +(backTo?'<button class="back" onclick="go(\''+backTo+'\','+bp+')" aria-label="返回">'+icon('back',22)+'</button>':'')
    +'<div class="title'+(backTo?' t-back':'')+'"'+(backTo?' onclick="go(\''+backTo+'\','+bp+')" role="button"':'')+'>'+esc(title)+'</div>'
    +'<div class="pts">'+icon('star',14)+' '+fmt(S.points)+'</div>'
    +'</div>';
}
function starsHtml(n,max){
  let h='';
  for(let i=0;i<max;i++){
    h+='<span class="'+(i<n?'':'s-off')+'">'+icon('star')+'</span>';
  }
  return h;
}

function renderMap(){
  let chs='';

    chs+='<div class="ch-card glass '+(allDone?'done':'')+(cur?' cur':'')+'" role="button" tabindex="0" onclick="go(\'stage\',{ch:'+i+',idx:0})" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){go(\'stage\',{ch:'+i+',idx:0})}">'
      +'<div class="letter">'+esc(ch.name)+'</div><div class="cnt">'+ch.words.length+' 词</div>'
      +'<div class="star-row">'+starsHtml(cm<=3?cs:Math.round(cs/cm*3),3)+'</div>'
      +'<div class="star-num">'+cs+' / '+cm+' 星</div>'

  });
  return topbar('关卡地图','home')

function renderStage(p){
  const ch=CHAPTERS[p.ch];
  if(!ch)return renderMap();
  let rows='';
  ch.stages.forEach((st,i)=>{
    const stars=stageStars(p.ch,i);
    const un=stageUnlocked(p.ch,i);
    const done=stars>0;
    const t='第 '+(i+1)+' 关 · '+st.words.length+' 词';
    const d=done?('已获得 '+stars+' 星'):(un?'未开始':'完成上一关解锁');
    const act=un?"go('learn',{ch:"+p.ch+",idx:"+i+"})":'toast(\'先完成上一关解锁嗷~\')';
    rows+='<div class="stage-row glass '+(done?'done':'')+(un?'':' locked')+'" role="button" tabindex="0" onclick="'+act+'" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){'+act+'}">'
      +'<div class="no">'+(un?String(i+1):icon('lock',20))+'</div>'
      +'<div class="body"><div class="t">'+esc(t)+'</div><div class="d">'+d+'</div></div>'
      +'<div class="stars">'+starsHtml(stars,3)+'</div>'
      +'</div>';
  });
  return topbar(ch.name+' · '+ch.words.length+' 词','map')
  +'<div class="stage-list">'+rows+'</div>';
}

Learn.init=function(ch,idx,words){

Learn.flipCard=function(){

/* ================================================================
 * 通用：题目生成 / 干扰项
 * ================================================================ */
function distractorWords(target,count){
  const out=[];const seen=new Set([target]);
  const shuffled=shuffle(WORDS);
  for(const w of shuffled){
    if(out.length>=count)break;
    if(!seen.has(w[0])){seen.add(w[0]);out.push(w);}
  }
  return out;
}
function qGen(mode,words){
  const qs=[];
  for(const w of words){
    if(mode==='spell'){qs.push({w});}
    else{qs.push({w,opts:shuffle([w].concat(distractorWords(w[0],3)))});}
  }
  return qs;
}

Quiz.sayWord=function(){const q=Quiz.qs[Quiz.qi];if(q&&q.w){if(!('speechSynthesis' in window)){toast('当前浏览器不支持语音发音','bad');return;}speak(q.w[0],true);}};
Quiz.answer=function(i){
  if(Quiz.locked)return;

/* ================================================================

const Match={ch:0,idx:0,words:[],roundWords:[],used:[],cards:[],first:null,flips:0,score:0,pairs:0,start:0,active:false,flippedSet:null,doneSet:null,flipLock:false};
Match.init=function(ch,idx,words){
  this.ch=ch;this.idx=idx;this.words=words.slice();this.used=[];this.flips=0;this.score=0;this.pairs=0;this.start=Date.now();this.active=true;this.doneSet=new Set();this.flippedSet=new Set();this.flipLock=false;
  this.nextRound();
};
Match.nextRound=function(){
  const rest=this.words.filter(w=>!this.used.includes(w[0]));
  const rw=rest.slice(0,5);
  this.roundWords=rw;
  const cards=[];
  rw.forEach(w=>{cards.push({w,side:'en'},{w,side:'cn'});});
  this.cards=shuffle(cards);
  this.first=null;this.flippedSet=new Set();this.flipLock=false;
};
function renderMatch(p){
  if(Match.used.length>=Match.words.length)return Match.finish();
  const grid=Match.cards.map((c,i)=>{
    const face=c.side==='en'?esc(c.w[0]):esc(c.w[2]);
    const flipped=(Match.flippedSet&&Match.flippedSet.has(i));
    const matched=(Match.doneSet&&Match.doneSet.has(i));
    return '<div class="mcard'+(flipped?' flipped':'')+(matched?' matched':'')+'" data-i="'+i+'" onclick="Match.click('+i+')">'
      +'<div class="mc-inner"><div class="mc-f mc-front">'+icon('star',20)+'</div><div class="mc-f mc-back">'+face+'</div></div></div>';
  }).join('');
  return topbar(CHAPTERS[p.ch].name+' · 第'+(p.idx+1)+'关','pick',{ch:p.ch,idx:p.idx})
  +'<div class="game-head"><span class="g-t">翻牌配对</span><span class="pill">已配 '+Match.pairs+' / '+Match.words.length+'</span></div>'
  +'<div class="q-progress"><span style="width:'+Math.round(Match.pairs/Match.words.length*100)+'%"></span></div>'
  +'<div class="match-grid">'+grid+'</div>'
  +'<div style="text-align:center;font-size:12px;color:var(--ink-faint);margin-top:12px">找出 英文 ↔ 中文 配对 · 误翻会扣分</div>';
}
Match.click=function(i){
  if(Match.flipLock)return;
  if(Match.doneSet&&Match.doneSet.has(i))return;
  if(Match.first===null){
    Match.first=i;
    Match.flippedSet=new Set([i]);
    renderMatchNow();
  }else if(Match.first===i){
    return;
  }else{
    const a=Match.cards[Match.first],b=Match.cards[i];
    Match.flippedSet=new Set([Match.first,i]);
    Match.flipLock=true;
    renderMatchNow();
    const ok=a.w[0]===b.w[0]&&a.side!==b.side;
    setTimeout(()=>{
      Match.flips++;
      if(ok){
        Match.doneSet.add(Match.first);Match.doneSet.add(i);
        Match.pairs++;Match.score+=10;
        markWord(a.w[0],true);
      }else{
        Match.score=Math.max(0,Match.score-2);
        toast('没对上，再试试','bad');
      }
      Match.first=null;Match.flippedSet=new Set();Match.flipLock=false;
      if(Match.pairs>=Match.roundWords.length&&Match.roundWords.length>=Match.words.length){renderMatchNow();return;}
      if(Match.pairs>=Match.roundWords.length){
        Match.roundWords.forEach(w=>Match.used.push(w[0]));
        Match.nextRound();
      }
      renderMatchNow();
    },520);
  }
};
function renderMatchNow(){go('play',{ch:Match.ch,idx:Match.idx,mode:'match'});}
Match.finish=function(){
  if(!Match.active)return;
  Match.active=false;
  const secs=Math.round((Date.now()-Match.start)/1000);
  const miss=Math.max(0,Match.flips-Match.pairs);
  const stars=miss===0?3:(miss<=3?2:(miss<=6?1:0));
  finishGame({ch:Match.ch,idx:Match.idx,title:'翻牌配对',stars,score:Match.score,correct:Match.pairs,total:Match.words.length,secs,wrongList:[],maxCombo:0});
};

/* ================================================================
 * 游戏：打地鼠（30 秒限时）
 * ================================================================ */
const Whack={ch:0,idx:0,words:[],targets:[],holes:[],left:30,score:0,hits:0,total:0,start:0,active:false,timer:null,bag:[],wrongList:[]};
Whack.init=function(ch,idx,words){
  this.ch=ch;this.idx=idx;this.words=words.slice();this.left=30;this.score=0;this.hits=0;this.total=0;this.start=Date.now();this.active=true;
  this.bag=shuffle(this.words.slice());this.wrongList=[];
  if(this.timer)clearInterval(this.timer);
  this.nextRound();
  this.timer=setInterval(()=>Whack.tick(),1000);
};
Whack.nextRound=function(){
  if(!this.bag||!this.bag.length)this.bag=shuffle(this.words.slice());
  const t=[];const seen=new Set();let guard=0;
  while(t.length<3&&seen.size<this.words.length&&guard++<60){
    if(!this.bag.length)this.bag=shuffle(this.words.slice());
    const w=this.bag.shift();
    if(seen.has(w[0]))continue;
    seen.add(w[0]);t.push(w);
  }
  this.targets=t.map(w=>w[0]);
  const inter=[];const used=new Set(this.targets);
  while(inter.length<6){
    const w=WORDS[Math.floor(Math.random()*WORDS.length)];
    if(!used.has(w[0])){used.add(w[0]);inter.push(w[0]);}
  }
  this.holes=shuffle(t.map(w=>w[0]).concat(inter));
};
Whack.tick=function(){
  Whack.left--;
  const el=document.getElementById('wtimer');
  if(el)el.textContent=Whack.left+'s';
  if(Whack.left<=0){Whack.finish();}
};
Whack.hit=function(i){
  if(!Whack.active||Whack.left<=0)return;
  const word=Whack.holes[i];
  const isT=Whack.targets.includes(word);
  Whack.total++;
  if(isT){
    Whack.hits++;Whack.score+=10;
    markWord(word,true);
  }else{
    Whack.score=Math.max(0,Whack.score-5);
    markWord(word,false);
    if(!Whack.wrongList.some(w=>w[0]===word)){
      const src=WORDS.find(w=>w[0]===word);
      if(src)Whack.wrongList.push(src);
    }
  }
  Whack.nextRound();
  const area=document.getElementById('wArea');
  if(area)area.innerHTML=Whack.holesHtml();
  const scoreEl=document.getElementById('wscore');
  if(scoreEl)scoreEl.innerHTML='得分 '+Whack.score+' · 命中 '+Whack.hits+'/'+Whack.total;
};
Whack.holesHtml=function(){
  return Whack.holes.map((w,i)=>{
    const isT=Whack.targets.includes(w);
    return '<div class="whole '+(isT?'target':'plain')+'" role="button" tabindex="0" onclick="Whack.hit('+i+')" onkeydown="if(event.key===\'Enter\'){Whack.hit('+i+')}">'+esc(w)+'</div>';
  }).join('');
};
function renderWhack(p){
  const st=stageOf(p.ch,p.idx);
  if(!st)return renderMap();
  if(!(Whack.active&&Whack.ch===p.ch&&Whack.idx===p.idx))Whack.init(p.ch,p.idx,st.words);
  return topbar(CHAPTERS[p.ch].name+' · 第'+(p.idx+1)+'关','pick',{ch:p.ch,idx:p.idx})
  +'<div class="game-head"><span class="g-t">打地鼠</span><span class="pill" id="wtimer">'+Whack.left+'s</span></div>'
  +'<div style="text-align:center;font-size:13px;color:var(--ink-soft);margin:4px 0 10px">点<span style="color:#089A82;font-weight:800">深绿实心</span>的单词！点中 +10，点错 -5 · <span style="color:#AEB8C6;font-weight:700">灰白虚线</span>是干扰词</div>'
  +'<div class="whack-field" id="wArea">'+Whack.holesHtml()+'</div>'
  +'<div style="text-align:center;font-size:13px;font-weight:700;color:var(--sky-600);margin-top:10px" id="wscore">得分 '+Whack.score+' · 命中 '+Whack.hits+'/'+Whack.total+'</div>';
}
Whack.finish=function(){
  if(!Whack.active)return;
  Whack.active=false;
  if(Whack.timer){clearInterval(Whack.timer);Whack.timer=null;}
  const total=Math.max(Whack.total,Whack.hits);
  const rate=total>0?Whack.hits/total:0;
  const stars=rate>=0.85?3:(rate>=0.6?2:(rate>=0.35?1:0));
  const secs=Math.round((Date.now()-Whack.start)/1000);
  finishGame({ch:Whack.ch,idx:Whack.idx,title:'打地鼠',stars,score:Whack.score,correct:Whack.hits,total,secs,wrongList:Whack.wrongList||[],maxCombo:0});
};

/* ================================================================
 * 游戏：消消乐（答对消除格子，清屏过关）
 * ================================================================ */
const Pop={ch:0,idx:0,words:[],cur:null,cleared:0,wrongAns:0,score:0,start:0,locked:false,active:false};
Pop.init=function(ch,idx,words){
  this.ch=ch;this.idx=idx;this.words=words.slice();this.cleared=0;this.wrongAns=0;this.score=0;this.start=Date.now();this.locked=false;this.active=true;
  this.order=shuffle(this.words.slice());this.oi=0;
  this.cur=this.makeQ();
};
Pop.makeQ=function(){
  if(!this.order||!this.order.length||this.order.length!==this.words.length)this.order=shuffle(this.words.slice());
  if(!(this.oi>=0)||this.oi>=this.order.length)this.oi=0;
  const w=this.order[this.oi++];
  const opts=shuffle([w].concat(distractorWords(w[0],3)));
  return {w,opts};
};
function renderPop(p){
  const st=stageOf(p.ch,p.idx);
  if(!st)return renderMap();
  if(!(Pop.active&&Pop.ch===p.ch&&Pop.idx===p.idx))Pop.init(p.ch,p.idx,st.words);
  const q=Pop.cur;
  let cells='';

const Judge={ch:0,idx:0,words:[],qs:[],qi:0,correct:0,combo:0,maxCombo:0,score:0,wrongList:[],start:0,left:45,timer:null,locked:false,active:false};
Judge.init=function(ch,idx,words){
  this.ch=ch;this.idx=idx;this.words=words.slice();
  const qs=[];
  this.words.forEach(w=>{
    const wrong=distractorWords(w[0],1)[0];
    const isRight=Math.random()<0.5;
    qs.push({w,shown:isRight?w:wrong,answer:isRight});
  });
  this.qs=shuffle(qs);this.qi=0;this.correct=0;this.combo=0;this.maxCombo=0;this.score=0;this.wrongList=[];this.start=Date.now();this.left=45;this.locked=false;this.active=true;
  if(this.timer)clearInterval(this.timer);
  this.timer=setInterval(()=>Judge.tick(),1000);
};
Judge.tick=function(){
  Judge.left--;
  const el=document.getElementById('jtimer');
  if(el)el.textContent=Judge.left+'s';
  if(Judge.left<=0){Judge.finish();}
};
function renderJudge(p){
  const st=stageOf(p.ch,p.idx);
  if(!st)return renderMap();
  if(!(Judge.active&&Judge.ch===p.ch&&Judge.idx===p.idx))Judge.init(p.ch,p.idx,st.words);

  const q=Judge.qs[Judge.qi];

    +(S.showPhonetic&&q.w[1]?'<div class="ph">/'+esc(q.w[1])+'/</div>':'')

    +'<button class="btn btn-ghost" style="flex:1;color:#C45454;border-color:rgba(255,107,107,.4);background:rgba(255,107,107,.1)" onclick="Judge.answer(false)">'+icon('x',20)+' 错</button>'

/* ================================================================
 * 结算
 * ================================================================ */
function finishGame(r){
  const key=stageKey(r.ch,r.idx);
  if(S.bestCombo<(r.maxCombo||0))S.bestCombo=r.maxCombo||0;
  const st=S.stages[key]||{stars:0,done:false,times:0};
  if(r.stars>st.stars)st.stars=r.stars;
  st.done=true;st.times++;
  S.stages[key]=st;
  S.points+=r.score;
  recordToday();
  save();
  go('result',{ch:r.ch,idx:r.idx,title:r.title,stars:r.stars,score:r.score,correct:r.correct,total:r.total,secs:r.secs,wrongList:r.wrongList||[],maxCombo:r.maxCombo||0});
}
function recordToday(){
  S.days=S.days||{};
  S.days[todayStr()]=S.todayLearned;
}
function renderResult(p){
  const ch=CHAPTERS[p.ch];const st=ch.stages[p.idx];
  const nextUnlocked=stageUnlocked(p.ch,p.idx+1);
  const wrong=p.wrongList||[];
  let wrongHtml='';
  if(wrong.length){
    wrongHtml='<div class="wrong-list glass"><div class="wl-t">本局错词 · 已收入错题本</div>'
      +wrong.map(w=>'<div class="wrong-item"><span class="w">'+esc(w[0])+'</span><span class="m">'+esc(w[2])+'</span></div>').join('')
      +'</div>';
  }
  const pct=Math.round(p.correct/Math.max(1,p.total)*100);
  return topbar(p.title+' · 通关结算','stage',{ch:p.ch,idx:p.idx})
  +'<div class="result-hero glass">'
    +'<div class="r-t">'+esc(p.title)+' 完成！</div>'
    +'<div class="stars">'+starsHtml(p.stars,3)+'</div>'
    +'<div class="r-sub">'+(p.stars>=3?'完美通关，太强了小於！':(p.stars>=2?'很棒，再来一局冲三星！':'过关啦，多练练记更牢~'))+'</div>'
  +'</div>'
  +'<div class="result-stats">'
    +'<div class="rstat glass"><b>+'+fmt(p.score)+'</b><span>本局得分</span></div>'
    +'<div class="rstat glass"><b>'+pct+'%</b><span>正确率</span></div>'

  +'</div>'
  +wrongHtml;
}

  if(!Review.active){
    const seen=new Set();
    const pool=[];
    wrongWords().forEach(w=>{if(!seen.has(w[0])){seen.add(w[0]);pool.push(w);}});
    dueWords().forEach(w=>{if(!seen.has(w[0])){seen.add(w[0]);pool.push(w);}});
    if(!pool.length){
      return topbar('今日复习','home')
      +'<div class="empty-state glass"><div class="e-ic">'+icon('check',32)+'</div>'
      +'<div style="font-size:17px;font-weight:800;margin-bottom:6px">没有待复习的词</div>'

      +'<button class="btn btn-primary" style="margin-top:18px" onclick="go(\'map\')">去闯关</button></div>';
    }

    +'<div class="set-row"><button class="btn danger" style="min-height:44px;padding:0 20px;font-size:14px" onclick="resetAll()">重置全部进度</button></div>'
  +'</div>'
  +'<div style="text-align:center;font-size:12px;color:var(--ink-faint);margin-top:18px;line-height:1.8">词库数据：四级高频核心词 + 听力阅读必考词<br>进度保存在本地浏览器，清除缓存会丢失</div>';
}
function setGoal(n){S.dailyGoal=n;save();go('settings');toast('每日目标设为 '+n+' 词','ok');}
function toggle(k){S[k]=!S[k];save();go('settings');}
function resetAll(){
  if(confirm('确定要重置全部学习进度吗？此操作不可恢复。')){
    localStorage.removeItem(KEY);
    S=Object.assign({},DEFAULTS);
    save();
    go('home');
    toast('进度已重置','ok');
  }
}

/* ================================================================
 * 启动
 * ================================================================ */
function clearTimers(){
  if(Whack.timer){clearInterval(Whack.timer);Whack.timer=null;}
  if(Judge.timer){clearInterval(Judge.timer);Judge.timer=null;}
}
const _go=go;
go=function(name,params){
  if(name!=='play')clearTimers();
  _go(name,params);
};
S=load();
newDayIfNeeded();
go('home');

</script>
</body>
</html>
